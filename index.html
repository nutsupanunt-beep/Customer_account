  <script>
    // ==========================================
    // 🟢 ระบบจัดการเวอร์ชัน (Version Control)
    // ==========================================
    const CURRENT_VERSION = "V.11.7";
    
    const APP_CHANGELOG = [
        {
            version: "V.11.7",
            date: "10/09/2026",
            changes: [
                "แก้ไขปัญหาหน้าจอล็อกอินค้าง (Infinite Loading) ด้วยระบบดักจับ Error อัจฉริยะ",
                "ปิดกั้นป๊อปอัปเปลี่ยนรหัสผ่านของเบราว์เซอร์กวนใจ 100% (Chrome Password Protection Bypass)",
                "ซ่อนการแจ้งเตือนค้างชำระในเมนูของบัญชี Guest อย่างสมบูรณ์",
                "ปรับแก้ฟอนต์และขนาดตัวอักษรให้สวยงามตรงตามรูปตัวอย่างต้นฉบับ"
            ]
        },
        {
            version: "V.11.6",
            date: "10/09/2026",
            changes: [
                "แก้ไขบั๊กตัวอักษรเมนูด้านซ้ายขาดหาย โดยปรับให้ข้อความยาวปัดบรรทัดใหม่อัตโนมัติ"
            ]
        },
        {
            version: "V.11.5",
            date: "10/09/2026",
            changes: [
                "ปรับปรุงการจัดเรียงในหน้าจัดการลูกค้า ให้คลีนและใหญ่ขึ้นตามดีไซน์ต้นแบบ"
            ]
        },
        {
            version: "V.11.3",
            date: "10/09/2026",
            changes: [
                "เพิ่มระบบ 'แจ้งเตือนเรียกเก็บเงินอัจฉริยะ' แสดงยอดรวมที่ต้องเก็บเมื่อถึงกำหนด",
                "เพิ่มตัวเลข (Badge) สีแดงที่เมนูจัดการลูกค้า เพื่อบอกจำนวนรายการที่ค้างชำระ"
            ]
        }
    ];

    // ==========================================
    // 🔵 Database & Configuration
    // ==========================================
    const savedConfig = JSON.parse(localStorage.getItem('app_supabase_config') || '{}');
    var defaultSupabaseUrl = 'https://rmdlpaofydzbuzuozofs.supabase.co';
    var defaultSupabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtZGxwYW9meWR6YnV6dW96b2ZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0NzMwMjIsImV4cCI6MjA4NDA0OTAyMn0.JoWZ4m0TrQMgIX5kJEILv6nJbdc9hB-H82DDWPG09A4';

    var supabaseUrl = savedConfig.url || defaultSupabaseUrl;
    var supabaseKey = savedConfig.key || defaultSupabaseKey;
    
    var supabaseClient = null;
    try {
        if (window.supabase && window.supabase.createClient) {
            supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        } else {
            console.error("Supabase library not loaded correctly.");
        }
    } catch (e) {
        console.error("Failed to initialize Supabase:", e);
    }

    async function fetchAndNotify() {
        if (!supabaseClient) {
            if (window._dataHandler) window._dataHandler.onDataChanged([]);
            return;
        }
        try {
            const { data, error } = await supabaseClient.from('app_records').select('data');
            if (error) throw error;
            if (data && window._dataHandler) {
                const appData = data.map(row => row.data);
                window._dataHandler.onDataChanged(appData);
            }
        } catch (e) {
            console.error("Error fetching data:", e);
            if (e.code === '42P01' || e.message.includes('does not exist')) showSetupModal();
            else if (e.code === '42501') showSetupModal("Permission Denied (RLS)");
            else showConnectionErrorModal(e.message);
            if (window._dataHandler) window._dataHandler.onDataChanged([]);
        }
    }

    function showConnectionErrorModal(msg) {
        if(document.getElementById('setup-modal-overlay')) return;
        const modalId = 'setup-modal-overlay';
        const div = document.createElement('div');
        div.id = modalId;
        div.className = 'modal-overlay';
        div.style.zIndex = '9999';
        div.innerHTML = `
            <div class="modal-content relative" style="max-width: 500px; border-left: 6px solid #ef4444;">
                <h3 class="text-xl font-bold mb-4 text-red-600">⚠️ เชื่อมต่อฐานข้อมูลไม่สำเร็จ</h3>
                <p class="mb-4 text-gray-700">ระบบไม่สามารถเชื่อมต่อกับ Supabase ได้</p>
                <div class="bg-gray-100 p-3 rounded text-xs text-gray-600 mb-4 break-all font-mono">
                    ${msg}
                </div>
                <p class="text-sm text-gray-500 mb-4">กรุณาตรวจสอบ URL หรือ Key ในหน้าตั้งค่า</p>
                <button onclick="document.getElementById('${modalId}').remove()" class="w-full py-2 bg-gray-200 rounded hover:bg-gray-300">ปิดหน้าต่าง</button>
            </div>
        `;
        document.body.appendChild(div);
    }

    function showSetupModal(type = "Missing Table") {
        const modalId = 'setup-modal-overlay';
        if (document.getElementById(modalId)) return;
        const div = document.createElement('div');
        div.id = modalId;
        div.className = 'modal-overlay';
        div.style.zIndex = '9999';
        div.innerHTML = `
            <div class="modal-content relative" style="max-width: 600px; border-left: 6px solid #ef4444;">
                <h3 class="text-xl font-bold mb-4 text-red-600">⚠️ แจ้งเตือนระบบ</h3>
                <p class="mb-4 text-gray-700">ไม่สามารถโหลดข้อมูลได้ (${type})</p>
                <button onclick="document.getElementById('${modalId}').remove()" class="w-full py-2 bg-gray-200 rounded hover:bg-gray-300">ปิดหน้าต่าง</button>
            </div>
        `;
        document.body.appendChild(div);
    }

    window.dataSdk = {
      init: async (handler) => {
        window._dataHandler = handler;
        if (supabaseClient) {
            await fetchAndNotify(); 
            supabaseClient.channel('public:app_records')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'app_records' }, () => {
                    fetchAndNotify();
                })
                .subscribe();
        } else {
            setTimeout(() => handler.onDataChanged([]), 0);
        }
        return { isOk: true };
      },
      create: async (record) => {
        if (!supabaseClient) return { isOk: false, error: { message: "Offline" } };
        try {
          const { error } = await supabaseClient.from('app_records').insert({ id: record.id, type: record.type, data: record });
          if (error) throw error;
          await fetchAndNotify(); 
          return { isOk: true };
        } catch (e) {
          if (e.code === '42P01') showSetupModal();
          return { isOk: false, error: { message: e.message } };
        }
      },
      update: async (record) => {
        if (!supabaseClient) return { isOk: false, error: { message: "Offline" } };
        try {
          const { error } = await supabaseClient.from('app_records').update({ data: record, type: record.type }).eq('id', record.id);
          if (error) throw error;
          await fetchAndNotify();
          return { isOk: true };
        } catch (e) { return { isOk: false, error: { message: e.message } }; }
      },
      delete: async (record) => {
        if (!supabaseClient) return { isOk: false, error: { message: "Offline" } };
        try {
          const { error } = await supabaseClient.from('app_records').delete().eq('id', record.id);
          if (error) throw error;
          await fetchAndNotify();
          return { isOk: true };
        } catch (e) { return { isOk: false, error: { message: e.message } }; }
      }
    };

    window.elementSdk = {
      config: null,
      init: async (options) => {
        window.elementSdk.config = options.defaultConfig;
        if(options.onConfigChange) options.onConfigChange(window.elementSdk.config);
        return { isOk: true };
      },
      setConfig: (newConfig) => {
        window.elementSdk.config = { ...window.elementSdk.config, ...newConfig };
      }
    };
  </script>

  <script>
    const defaultConfig = {
      app_title: "ARBANG FAST TRACK ASSET LOAN",
      menu_add_customer: "เพิ่มข้อมูลลูกค้า",
      menu_manage_customer: "จัดการรายการลูกค้า",

      menu_statement: "ข้อมูลเดินบัญชี",

      secondary_color: "#1f2937",   
      text_color: "#0f172a",        
      background_color: "#f8fafc",  
      surface_color: "#ffffff"      
    };

    let allRecords = [];
    let currentUser = null;
    let currentView = 'manage'; 
    let editingCustomer = null;
    let editingUser = null;
    let confirmDeleteId = null;
    let showingModal = null;
    let isMobileSidebarOpen = false;
    let manageSearchTerm = '';
    let expandedCustomerName = null;
    
    let stmtSelectedDate = new Date();
    let topChartInstance = null;
    let doughnutChartInstance = null;

    let whatsNewTimerInterval = null;

    function checkAndShowWhatsNew() {
        try {
            const lastSeen = localStorage.getItem('app_last_seen_version');
            if (lastSeen !== CURRENT_VERSION) {
                const currentLog = APP_CHANGELOG.find(l => l.version === CURRENT_VERSION) || APP_CHANGELOG[0];
                
                const modalId = 'whats-new-modal';
                if(document.getElementById(modalId)) return true;

                const div = document.createElement('div');
                div.id = modalId;
                div.className = 'modal-overlay fade-in';
                div.style.zIndex = '10000'; 
                
                div.innerHTML = `
                <div class="modal-content relative flex flex-col items-center p-8 text-center" style="max-width: 500px; border-radius: 20px;">
                    <div class="w-24 h-24 rounded-full border-[3px] flex items-center justify-center mb-6" style="border-color: #0ea5e9;">
                        <span class="text-6xl font-light relative" style="color: #0ea5e9; top: -2px;">i</span>
                    </div>
                    
                    <h3 class="text-3xl font-black mb-6 text-gray-800 tracking-tight">มีอะไรใหม่ ${CURRENT_VERSION}?</h3>
                    
                    <ul class="text-left w-full space-y-3 mb-8 text-gray-600 font-medium text-base list-disc list-inside px-2">
                        ${currentLog.changes.map(c => `<li>${c}</li>`).join('')}
                    </ul>
                    
                    <button id="whats-new-btn" onclick="closeWhatsNew()" class="w-40 py-3 rounded-xl font-bold text-white shadow-md transition-all active:scale-95 text-lg uppercase tracking-wider" style="background: #0ea5e9;">OK (5s)</button>
                </div>
                `;
                document.body.appendChild(div);

                let timeLeft = 5;
                const btn = document.getElementById('whats-new-btn');
                
                whatsNewTimerInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft <= 0) {
                        clearInterval(whatsNewTimerInterval);
                        closeWhatsNew();
                    } else {
                        if(btn) btn.innerText = `OK (${timeLeft}s)`;
                    }
                }, 1000);
                
                return true; 
            }
        } catch(e) {
            console.warn("Storage access restricted", e);
        }
        return false; 
    }

    window.closeWhatsNew = function() {
        if(whatsNewTimerInterval) clearInterval(whatsNewTimerInterval);
        try { localStorage.setItem('app_last_seen_version', CURRENT_VERSION); } catch(e) {}
        const m = document.getElementById('whats-new-modal');
        if(m) m.remove();
        
        setTimeout(checkAndShowPaymentReminder, 500);
    };

    function startUpdateChecker() {
        setInterval(async () => {
            try {
                let fetchUrl = new URL(window.location.href.split('#')[0]);
                fetchUrl.searchParams.set('nocache', new Date().getTime());
                
                const response = await fetch(fetchUrl.toString(), { cache: 'no-store' });
                const htmlText = await response.text();
                
                const match = htmlText.match(/const CURRENT_VERSION\s*=\s*['"]([^'"]+)['"]/);
                if (match && match[1] && match[1] !== CURRENT_VERSION) {
                    showUpdateAvailableModal(match[1]);
                }
            } catch(e) {}
        }, 60000); 
    }

    function showUpdateAvailableModal(newVersion) {
        if(document.getElementById('update-available-modal')) return;
        const modalId = 'update-available-modal';
        const div = document.createElement('div');
        div.id = modalId;
        div.className = 'modal-overlay fade-in';
        div.style.zIndex = '10001'; 
        div.innerHTML = `
            <div class="modal-content text-center p-8" style="max-width: 450px; border-radius: 20px;">
                <div class="text-6xl mb-6">🔄</div>
                <h3 class="text-2xl font-black mb-3 text-gray-800 tracking-tight">มีเวอร์ชันใหม่อัปเดต!</h3>
                <p class="text-gray-600 mb-8 font-medium">ระบบได้รับการอัปเดตเป็น <span class="font-bold text-blue-600">${newVersion}</span><br>กรุณากดปุ่มด้านล่างเพื่อรีสตาร์ทและรับฟีเจอร์ล่าสุด</p>
                <button onclick="window.location.reload(true)" class="w-full py-4 rounded-xl font-bold text-white shadow-lg bg-blue-600 hover:bg-blue-700 transition-all text-lg uppercase tracking-wider active:scale-95">รีสตาร์ทแอปเดี๋ยวนี้</button>
            </div>
        `;
        document.body.appendChild(div);
    }
    
    function getDuePaymentsInfo() {
        const customers = getActiveCustomers();
        const daysBefore = getPaymentDaysBefore();
        let count = 0;
        let totalAmount = 0;
        
        customers.forEach(c => {
            if (canPayNow(c.next_payment_date, daysBefore)) {
                count++;
                totalAmount += (c.monthly_payment || 0);
            }
        });
        
        return { count, totalAmount };
    }

    function checkAndShowPaymentReminder() {
        // แข็งแกร่งขึ้น: ถ้าไม่ล็อกอิน หรือเป็น Guest ข้าม 100%
        if (!currentUser || currentUser.isGuestView) return; 
        
        const dueInfo = getDuePaymentsInfo();
        if (dueInfo.count === 0) return;

        const todayStr = new Date().toLocaleDateString('th-TH');
        try {
            const lastDate = localStorage.getItem('app_last_reminder_date');
            if (lastDate === todayStr) return; 
        } catch(e) {}

        const modalId = 'payment-reminder-modal';
        if(document.getElementById(modalId)) return;

        const div = document.createElement('div');
        div.id = modalId;
        div.className = 'modal-overlay fade-in';
        div.style.zIndex = '9998'; 
        
        const d = new Date();
        const dateDisplay = d.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });

        div.innerHTML = `
        <div class="modal-content relative flex flex-col items-center p-8 text-center" style="max-width: 400px; border-radius: 20px;">
            <div class="w-20 h-20 rounded-full bg-red-50 border-4 border-red-100 flex items-center justify-center mb-5">
                <span class="text-4xl relative" style="top: 2px;">🔔</span>
            </div>
            <h3 class="text-2xl font-black mb-2 text-gray-800 tracking-tight">แจ้งเตือนเก็บเงิน!</h3>
            <p class="text-gray-500 font-medium mb-6">ประจำวันที่ ${dateDisplay}</p>
            
            <div class="bg-slate-50 w-full p-5 rounded-2xl border border-slate-100 mb-8 shadow-inner">
                <p class="text-sm font-bold opacity-50 uppercase tracking-widest mb-1 text-gray-600">ยอดรวมถึงกำหนดชำระ</p>
                <p class="text-4xl font-black text-red-500 tracking-tight">฿${dueInfo.totalAmount.toLocaleString()}</p>
                <div class="mt-3 pt-3 border-t border-slate-200">
                    <p class="text-sm font-bold text-gray-600">จำนวน <span class="text-blue-600 text-lg">${dueInfo.count}</span> รายการ</p>
                </div>
            </div>
            
            <button onclick="closePaymentReminder()" class="w-full py-4 rounded-xl font-bold text-white shadow-md hover:shadow-lg transition-all active:scale-95 text-lg uppercase tracking-wider" style="background: #3b82f6;">รับทราบ</button>
        </div>
        `;
        document.body.appendChild(div);
    }

    window.closePaymentReminder = function() {
        const today = new Date().toLocaleDateString('th-TH');
        try { localStorage.setItem('app_last_reminder_date', today); } catch(e) {}
        const m = document.getElementById('payment-reminder-modal');
        if(m) m.remove();
    }

    const dataHandler = {
      onDataChanged(data) {
        allRecords = data || [];
        renderApp();
      }
    };

    window.toggleCustomerExpand = function(name) {
        if (expandedCustomerName === name) {
            expandedCustomerName = null; 
        } else {
            expandedCustomerName = name; 
        }
        renderApp();
    };

    function getToastDuration() {
        const settingsRecords = allRecords.filter(r => r.type === 'settings');
        if (settingsRecords.length > 0) {
            // ป้องกัน Error หากไม่มีวันที่ 
            try {
                settingsRecords.sort((a, b) => new Date(b.updated_at || b.created_at || 0) - new Date(a.updated_at || a.created_at || 0));
                return settingsRecords[0].toast_duration ? parseInt(settingsRecords[0].toast_duration) : 1500;
            } catch(e) { return 1500; }
        }
        return 1500;
    }

    function showToast(message, isError = false) {
      const toast = document.createElement('div');
      toast.className = `toast ${isError ? 'error' : ''}`;
      
      if (message.includes('เข้าสู่ระบบ')) {
          toast.style.background = '#3b82f6';
      } else if (message.includes('ออกจากระบบ') || message.includes('กลับไปหน้าหลัก')) {
          toast.style.background = '#ef4444';
      }
      
      toast.textContent = message;
      document.body.appendChild(toast);
      
      const duration = getToastDuration();
      setTimeout(() => toast.remove(), duration);
    }

    function showModal(content) { showingModal = content; renderApp(); }
    function hideModal() { showingModal = null; editingUser = null; editingCustomer = null; confirmDeleteId = null; renderApp(); }
    function toggleMobileSidebar() { isMobileSidebarOpen = !isMobileSidebarOpen; renderApp(); }

    function hashPassword(password) {
      if(!password) return "";
      let hash = 0;
      for (let i = 0; i < password.length; i++) {
        const char = password.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return hash.toString();
    }

    function checkLogin() {
      try {
          let savedUser = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
          if (savedUser) {
            currentUser = JSON.parse(savedUser);
            if (currentUser.isGuestView && currentView === 'add') currentView = 'manage';
          }
      } catch(e) { console.error(e); }
    }

    function login(username, password, rememberMe = false) {
      try {
          if (username === 'admin' && password === 'admin') {
            currentUser = { id: 'super_admin', username: 'Admin (Super)', isAdmin: true };
            if (rememberMe) localStorage.setItem('currentUser', JSON.stringify(currentUser));
            else sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
            showToast('เข้าสู่ระบบ Super Admin สำเร็จ');
            renderApp();
            return true;
          }
          const userRecord = allRecords.find(r => r.type === 'user' && r.username === username && r.password_hash === hashPassword(password));
          if (userRecord) {
            currentUser = { username: userRecord.username, id: userRecord.id };
            if (rememberMe) localStorage.setItem('currentUser', JSON.stringify(currentUser));
            else sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
            showToast('เข้าสู่ระบบสำเร็จ');
            renderApp();
            return true;
          }
          return false;
      } catch(e) {
          console.error("Login Error:", e);
          return false;
      }
    }

    function getUserSettings() {
      if (!currentUser) return null;
      const defaultSettings = { 
          is_dark_mode: false, 
          payment_days_before: 5, 
          guest_permissions: currentUser.isAdmin ? 'add,manage,history,statement,settings,edit' : 'manage,history,statement',
      };

      if (currentUser.isGuestView) {
        const adminSettings = getGlobalGuestSettings();
        if (adminSettings) {
             return { ...defaultSettings, ...adminSettings, guest_permissions: 'manage' };
        }
        return { ...defaultSettings, guest_permissions: 'manage' };
      }
      
      const userSettings = allRecords.find(r => r.type === 'settings' && r.account_id === currentUser.id);
      return userSettings ? { ...defaultSettings, ...userSettings } : defaultSettings; 
    }
    
    function getGlobalGuestSettings() {
        const adminSettings = allRecords.find(r => r.type === 'settings' && r.account_id === 'super_admin');
        if (adminSettings) return adminSettings;
        return null;
    }

    async function saveSettings(isDarkMode, paymentDaysBefore, guestPermissions, toastDuration) {
      if (!currentUser || currentUser.isGuestView) return;

      const existing = getUserSettings();
      let recordToUpdate = existing;
      
      if (currentUser.isAdmin) {
         const anySettings = allRecords.find(r => r.type === 'settings');
         if(anySettings) recordToUpdate = anySettings;
         else recordToUpdate = null; 
      }

      const updatedData = {
          is_dark_mode: isDarkMode,
          payment_days_before: paymentDaysBefore,
          guest_permissions: guestPermissions,
          updated_at: new Date().toISOString()
      };
      
      if (toastDuration !== undefined) {
          updatedData.toast_duration = toastDuration;
      }

      if (recordToUpdate && recordToUpdate.id) { 
        await window.dataSdk.update({ ...recordToUpdate, ...updatedData });
      } else {
        await window.dataSdk.create({
          type: 'settings',
          id: 'settings_' + Date.now(),
          account_id: currentUser.id,
          created_at: new Date().toISOString(),
          ...updatedData
        });
      }
      showToast('บันทึกการตั้งค่าสำเร็จ');
    }

    function canAccessView(view) {
      if (!currentUser) return false;
      if (currentUser.isAdmin) return true;
      
      if (currentUser.isGuestView) {
          const targetSettings = allRecords.find(r => r.type === 'settings' && r.account_id === currentUser.targetAccountId);
          if (targetSettings && targetSettings.guest_permissions) {
              return targetSettings.guest_permissions.includes(view);
          }
          const adminSettings = allRecords.find(r => r.type === 'settings' && r.account_id === 'super_admin');
          if (adminSettings && adminSettings.guest_permissions) {
              return adminSettings.guest_permissions.includes(view);
          }
          return 'manage,history,statement'.includes(view);
      }
      
      return true;
    }

             if (targetSettings && targetSettings.guest_permissions) {

    function calculateMonthlyPayment(principal, interestRate, installments, billFee = 0) {
      if (!principal || !installments) return 0;
      const monthlyInterest = interestRate / 100;
      const baseTotalAmount = principal * (1 + (monthlyInterest * installments));
      return Math.round(baseTotalAmount / installments) + billFee;
    }

    function addMonthsToDate(dateStr, months) {
      const date = new Date(dateStr);
      date.setMonth(date.getMonth() + months);
      return date.toISOString().split('T')[0];
    }

    function canPayNow(nextPaymentDate, daysBefore) {
      if(!nextPaymentDate) return false;
      const today = new Date();
      const paymentDate = new Date(nextPaymentDate);
      const daysUntil = Math.ceil((paymentDate - today) / (1000 * 60 * 60 * 24));
      return daysUntil <= daysBefore;
    }

    function getLenderColor(name, isDark) {
        if (!name || name === '-') return isDark ? '#9ca3af' : '#6b7280'; 
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        const colorsLight = ['#2563eb', '#dc2626', '#16a34a', '#9333ea', '#ea580c', '#0d9488', '#db2777', '#4f46e5', '#ca8a04', '#059669'];
        const colorsDark = ['#60a5fa', '#f87171', '#4ade80', '#c084fc', '#fb923c', '#2dd4bf', '#f472b6', '#818cf8', '#facc15', '#34d399'];
        const index = Math.abs(hash) % colorsLight.length;
        return isDark ? colorsDark[index] : colorsLight[index];
    }

    function saveAutocompleteData(data) {
      const current = getAutocompleteData();
      const addUnique = (arr, val) => { if(val !== undefined && val !== null && val !== '' && !arr.includes(val)) arr.push(val); };
      addUnique(current.names, data.customerName); addUnique(current.products, data.product); addUnique(current.prices, data.productPrice);
      addUnique(current.interests, data.interestRate); addUnique(current.installments, data.installments); addUnique(current.fees, data.billFee);
      localStorage.setItem('app_autocomplete_options', JSON.stringify(current));
    }

    async function addCustomer(customerData) {
      if (allRecords.filter(r => r.type === 'customer').length >= 999) return showToast('ถึงขีดจำกัด 999 รายการแล้ว', true);
      let monthlyPayment = customerData.billAmount ? parseInt(customerData.billAmount) : calculateMonthlyPayment(customerData.productPrice, customerData.interestRate, customerData.installments, customerData.billFee);
      const newCustomer = {
        type: 'customer', id: 'cust_' + Date.now(), customer_name: customerData.customerName,
        product: customerData.product, product_price: customerData.productPrice, interest_rate: customerData.interestRate,
        bill_fee: customerData.billFee, bill_amount: monthlyPayment, installments: customerData.installments,
        contract_date: customerData.contractDate, monthly_payment: monthlyPayment, paid_installments: 0,
        next_payment_date: addMonthsToDate(customerData.contractDate, 1), status: 'active',
        account_id: currentUser ? currentUser.id : 'guest', created_at: new Date().toISOString()
      };
      const result = await window.dataSdk.create(newCustomer);
      if (result.isOk) {
        await addHistory('เพิ่มข้อมูล', `เพิ่มข้อมูลลูกค้า <b>${customerData.customerName}</b><br><span class="block mt-3 p-3 rounded bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm"><b>รายละเอียด:</b><br>• สินค้า: ${customerData.product}<br>• ราคา: ฿${(customerData.productPrice||0).toLocaleString()}</span>`);
        saveAutocompleteData(customerData); showToast('เพิ่มข้อมูลลูกค้าสำเร็จ');
      } else showToast('เกิดข้อผิดพลาด: ' + result.error.message, true);
    }

    async function updateCustomer(customerId, updates) {
      const customer = allRecords.find(r => r.id === customerId); if (!customer) return;
      
      let changes = [];
      if (customer.customer_name !== updates.customer_name) changes.push(`ชื่อลูกค้า: ${customer.customer_name} ➔${updates.customer_name}`);
      if (customer.product !== updates.product) changes.push(`สินค้า: ${customer.product} ➔${updates.product}`);
      if (parseFloat(customer.product_price || 0) !== parseFloat(updates.product_price || 0)) changes.push(`ราคาสินค้า: ฿${(customer.product_price\vert{}\vert{}0).toLocaleString()} ➔ ฿${(updates.product_price||0).toLocaleString()}`);
      if (parseFloat(customer.monthly_payment || 0) !== parseFloat(updates.monthly_payment || 0)) changes.push(`ค่างวด: ฿${(customer.monthly_payment\vert{}\vert{}0).toLocaleString()} ➔ ฿${(updates.monthly_payment||0).toLocaleString()}`);
      if (parseInt(customer.installments || 0) !== parseInt(updates.installments || 0)) changes.push(`จำนวนงวดรวม: ${customer.installments} ➔${updates.installments}`);
      if (parseInt(customer.paid_installments || 0) !== parseInt(updates.paid_installments || 0)) changes.push(`งวดที่ชำระแล้ว: ${customer.paid_installments} ➔${updates.paid_installments}`);
      if (customer.contract_date !== updates.contract_date) changes.push(`วันที่ทำสัญญา: ${customer.contract_date} ➔${updates.contract_date}`);
      if (customer.next_payment_date !== updates.next_payment_date) changes.push(`วันที่ชำระงวดถัดไป: ${new Date(customer.next_payment_date).toLocaleDateString('th-TH')} ➔${new Date(updates.next_payment_date).toLocaleDateString('th-TH')}`);
      if (customer.status !== updates.status) changes.push(`สถานะ: ${customer.status === 'active' ? 'กำลังผ่อน' : 'ผ่อนครบแล้ว'} ➔ ${updates.status === 'active' ? 'กำลังผ่อน' : 'ผ่อนครบแล้ว'}`);

      let details = `แก้ไขข้อมูลของ <b>${customer.customer_name}</b> (รายการ: ${customer.product})`;
      if (changes.length > 0) {
          details += `<span class="block mt-3 p-3 rounded bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm text-gray-700 dark:text-gray-300"><b>รายการที่ถูกปรับเปลี่ยน:</b><br>• ${changes.join('<br>• ')}</span>`;
      } else {
          details += `<span class="block mt-3 p-3 rounded bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm text-gray-700 dark:text-gray-300">ไม่มีการเปลี่ยนค่าใดๆ</span>`;
      }

      const result = await window.dataSdk.update({ ...customer, ...updates, updated_at: new Date().toISOString() });
      if (result.isOk) { 
          await addHistory('แก้ไขข้อมูล', details); 
          showToast('แก้ไขข้อมูลสำเร็จ'); 
          hideModal(); 
      } 
      else showToast('เกิดข้อผิดพลาด: ' + result.error.message, true);
    }

    async function makePayment(customerId) {
      const customer = allRecords.find(r => r.id === customerId); if (!customer) return;
      const newPaid = customer.paid_installments + 1;
      const isComplete = newPaid >= customer.installments;
      const updates = isComplete ? { paid_installments: newPaid, status: 'completed' } : { paid_installments: newPaid, next_payment_date: addMonthsToDate(customer.next_payment_date, 1) };
      const result = await window.dataSdk.update({ ...customer, ...updates, updated_at: new Date().toISOString() });
      if (result.isOk) { 
        const remaining = customer.installments - newPaid;
        const details = `${customer.customer_name} ชำระเงินค่า ${customer.product} งวดที่ ${newPaid} ราคา ${customer.monthly_payment.toLocaleString()} บาท สำเร็จ จำนวนงวดที่เหลืออีก ${remaining} งวด`;
        await addHistory(isComplete ? 'ชำระเงินครบ' : 'ชำระเงิน', details); 
        showToast(isComplete ? 'ชำระเงินครบแล้ว' : 'บันทึกการชำระเงินสำเร็จ'); 
      }
    }

    async function payAllForCustomer(name) {
        const daysBefore = getPaymentDaysBefore();
        const targets = getActiveCustomers().filter(c => c.customer_name === name && canPayNow(c.next_payment_date, daysBefore));
        if(targets.length === 0) {
            showToast('ไม่มีรายการที่ถึงกำหนดชำระ', true);
            return;
        }
        
        let count = 0;
        for (const c of targets) {
            const newPaid = c.paid_installments + 1;
            const isComplete = newPaid >= c.installments;
            
            const updates = isComplete 
                ? { paid_installments: newPaid, status: 'completed', updated_at: new Date().toISOString() } 
                : { paid_installments: newPaid, next_payment_date: addMonthsToDate(c.next_payment_date, 1), updated_at: new Date().toISOString() };
                
            const result = await window.dataSdk.update({ ...c, ...updates });
            if (result.isOk) {
                 const remaining = c.installments - newPaid;
                 const details = `${c.customer_name} ชำระเงินค่า ${c.product} งวดที่ ${newPaid} ราคา ${c.monthly_payment.toLocaleString()} บาท สำเร็จ จำนวนงวดที่เหลืออีก ${remaining} งวด`;
                 await addHistory(isComplete ? 'ชำระเงินครบ' : 'ชำระเงิน', details);
                 count++;
            }
        }
        showToast(`ชำระเงินเรียบร้อย ${count} รายการ`);
    }

    async function deleteCustomer(customerId) {
      const customer = allRecords.find(r => r.id === customerId); if (!customer) return;
      const result = await window.dataSdk.delete(customer);
      if (result.isOk) { 
          await addHistory('ลบข้อมูล', `ลบข้อมูลของ <b>${customer.customer_name}</b><br><span class="block mt-3 p-3 rounded bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-sm"><b>รายละเอียดที่ถูกลบ:</b><br>• สินค้า: ${customer.product}<br>• ราคา: ฿${(customer.product_price\vert{}\vert{}0).toLocaleString()}<br>• ค่างวด: ฿${(customer.monthly_payment||0).toLocaleString()}</span>`); 
          showToast('ลบข้อมูลสำเร็จ'); 
          confirmDeleteId = null; 
      } 
      else showToast('เกิดข้อผิดพลาด: ' + result.error.message, true);
    }

    async function deleteUser(userId) {
        const user = allRecords.find(r => r.id === userId && r.type === 'user'); 
        if(!user) {
            showToast('ไม่พบข้อมูลผู้ใช้', true);
            return;
        }
        const result = await window.dataSdk.delete(user);
        if(result.isOk) { showToast('ลบบัญชีผู้ใช้สำเร็จ'); hideModal(); } else showToast('ลบไม่สำเร็จ: ' + result.error.message, true);
    }

    async function adminResetPassword(userId, newPassword) {
        const user = allRecords.find(r => r.id === userId && r.type === 'user'); if(!user) return;
        const result = await window.dataSdk.update({ ...user, password_hash: hashPassword(newPassword), updated_at: new Date().toISOString() });
        if(result.isOk) { showToast('เปลี่ยนรหัสผ่านสำเร็จ'); hideModal(); } else showToast('เปลี่ยนรหัสผ่านไม่สำเร็จ: ' + result.error.message, true);
    }

    async function addHistory(action, details) {
      await window.dataSdk.create({ type: 'history', id: 'hist_' + Date.now(), history_action: action, history_details: details, history_date: new Date().toISOString(), account_id: currentUser ? currentUser.id : 'guest' });
    }

    function getActiveCustomers() {
      if (currentUser && currentUser.isAdmin) return allRecords.filter(r => r.type === 'customer' && r.status === 'active');
      if (currentUser && currentUser.isGuestView) {
          if (currentUser.targetAccountId === 'ALL') return allRecords.filter(r => r.type === 'customer' && r.status === 'active');
          return allRecords.filter(r => r.type === 'customer' && r.status === 'active' && r.account_id === currentUser.targetAccountId);
      }
      return allRecords.filter(r => r.type === 'customer' && r.status === 'active' && (currentUser ? r.account_id === currentUser.id : true));
    }

    function getCompletedCustomers() {
      if (currentUser && currentUser.isAdmin) return allRecords.filter(r => r.type === 'customer' && r.status === 'completed');
      if (currentUser && currentUser.isGuestView) {
          if (currentUser.targetAccountId === 'ALL') return allRecords.filter(r => r.type === 'customer' && r.status === 'completed');
          return allRecords.filter(r => r.type === 'customer' && r.status === 'completed' && r.account_id === currentUser.targetAccountId);
      }
      return allRecords.filter(r => r.type === 'customer' && r.status === 'completed' && (currentUser ? r.account_id === currentUser.id : true));
    }

    function getHistoryRecords() {
      const sorter = (a, b) => new Date(b.history_date) - new Date(a.history_date);
      if (currentUser && currentUser.isAdmin) return allRecords.filter(r => r.type === 'history').sort(sorter);
      if (currentUser && currentUser.isGuestView) {
          if (currentUser.targetAccountId === 'ALL') return allRecords.filter(r => r.type === 'history').sort(sorter);
          return allRecords.filter(r => r.type === 'history' && r.account_id === currentUser.targetAccountId).sort(sorter);
      }
      return allRecords.filter(r => r.type === 'history' && (currentUser ? r.account_id === currentUser.id : true)).sort(sorter);
    }

    function getCustomersSummary(customersList) {
      const customers = customersList || getActiveCustomers();
      const summary = {};
      customers.forEach(c => {
        if (!summary[c.customer_name]) {
            summary[c.customer_name] = { 
                name: c.customer_name, 
                totalNextMonth: 0, 
                count: 0, 
                lenderTotals: {} 
            };
        }
        summary[c.customer_name].totalNextMonth += (c.monthly_payment || 0); 
        summary[c.customer_name].count += 1;
        
        let ownerName = '-';
        const o = allRecords.find(r => r.type === 'user' && r.id === c.account_id);
        if (o) ownerName = o.username;
        
        if (!summary[c.customer_name].lenderTotals[ownerName]) {
            summary[c.customer_name].lenderTotals[ownerName] = 0;
        }
        summary[c.customer_name].lenderTotals[ownerName] += (c.monthly_payment || 0);
      });
      return Object.values(summary);
    }

      else if(currentView === 'history') html = renderHistory(config, dark, surfaceColor, textColor, primaryColor);
      else if(currentView === 'statement') html = renderStatement(config, dark, surfaceColor, textColor, primaryColor);
      else if(currentView === 'settings') html = renderSettings(config, dark, surfaceColor, textColor, primaryColor);
      else if(currentView === 'manage_users') html = renderAdminUsers(config, dark, surfaceColor, textColor, primaryColor, secondaryColor);
      else if(currentView === 'account') html = renderAccount(config, dark, surfaceColor, textColor, primaryColor);

      if (showingModal || editingCustomer || editingUser || confirmDeleteId) html += renderModal(config, dark, surfaceColor, textColor, primaryColor);
      return html;

    function renderManageCustomers(config, dark, surfaceColor, textColor, primaryColor, secondaryColor) {
      let customers = getActiveCustomers();
      
      if (manageSearchTerm) {
          const term = manageSearchTerm.toLowerCase();
          customers = customers.filter(c => 
              c.customer_name.toLowerCase().includes(term) || 
              c.product.toLowerCase().includes(term)
          );
      }
      
      customers.sort((a, b) => a.customer_name.localeCompare(b.customer_name, 'th'));
      const summary = getCustomersSummary(customers);
      const grandTotal = summary.reduce((sum, item) => sum + item.totalNextMonth, 0);

      const daysBefore = getPaymentDaysBefore();
      const isAdmin = currentUser && currentUser.isAdmin;
      const isGuestView = currentUser && currentUser.isGuestView;
      const isSpecialView = isAdmin || isGuestView;
      
      return `<div class="p-4 md:p-8">
        <h2 class="text-2xl font-black mb-8 tracking-tight" style="color: ${textColor};">${config.menu_manage_customer}</h2>
        
        <div class="relative mb-8">
            <input type="text" id="manage-search-input" value="${manageSearchTerm}" placeholder="ค้นหาชื่อลูกค้า หรือ สินค้า..." 
                class="w-full px-5 py-4 pl-12 rounded-2xl border shadow-sm focus:ring-4 transition-all font-medium text-lg" 
                style="background: ${surfaceColor}; border-color: ${dark ? '#374151' : '#e2e8f0'}; color: ${textColor}; outline-color: ${primaryColor}; focus:ring-[${primaryColor}] focus:ring-opacity-20;">
            <span class="absolute left-4 top-4 text-xl opacity-50">🔍</span>
            ${manageSearchTerm ? `<button id="manage-search-clear" class="absolute right-4 top-4 text-xl opacity-50 hover:opacity-100 transition-opacity">✖</button>` : ''}
        </div>

        <div class="mb-6">
            <div class="p-6 md:p-8 rounded-2xl shadow-xl transition-all mb-8 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 border-t-[4px] border-t-blue-500">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center">
                    <div>
                        <h3 class="text-xl font-black text-gray-800 dark:text-gray-100 mb-1">สรุปยอดตามลูกค้า</h3>
                        <p class="text-[11px] font-bold text-gray-400 uppercase tracking-widest">OVERVIEW</p>
                    </div>
                    <div class="text-left sm:text-right mt-4 sm:mt-0">
                        <p class="text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">ยอดรวมที่ต้องชำระทั้งหมด</p>
                        <p class="text-5xl md:text-6xl font-black tracking-tighter text-blue-500 drop-shadow-sm">฿${grandTotal.toLocaleString()}</p>
                    </div>
                </div>
            </div>
            
            <div class="flex flex-col space-y-4">
            ${summary.length===0?`<p class="text-center py-8 font-medium opacity-50 bg-white dark:bg-gray-800 rounded-2xl border" style="border-color: ${dark?'#374151':'#f1f5f9'}; color: ${textColor};">ไม่พบข้อมูล</p>`:''}
            ${summary.map(s=>{
                  const customerItems = customers.filter(c => c.customer_name === s.name);
                  
                  customerItems.sort((a, b) => {
                      let ownerA = '-';
                      const userA = allRecords.find(r => r.type === 'user' && r.id === a.account_id);
                      if(userA) ownerA = userA.username;
                      
                      let ownerB = '-';
                      const userB = allRecords.find(r => r.type === 'user' && r.id === b.account_id);
                      if(userB) ownerB = userB.username;
                      
                      return ownerA.localeCompare(ownerB, 'th');
                  });

                  const hasDueItems = customerItems.some(c => canPayNow(c.next_payment_date, daysBefore));
                  const isExpanded = expandedCustomerName === s.name;
                  
                  let breakdownHtml = '';
                  const lenders = Object.keys(s.lenderTotals).sort((a, b) => a.localeCompare(b, 'th'));

                  if (isSpecialView) {
                      breakdownHtml = `
                          <div class="w-full flex flex-col items-end">
                              <div class="flex items-center justify-end gap-4 mb-2 w-full pb-2">
                                  <span class="text-[11px] font-bold text-gray-400">ผู้ให้บริการ</span>
                                  <span class="text-[11px] font-bold text-gray-400 w-20 text-right">ยอดรวม</span>
                              </div>
                      `;

                      breakdownHtml += lenders.map(lender => {
                          const lenderColor = getLenderColor(lender, dark);
                          return `
                          <div class="flex items-center justify-end gap-4 mb-1.5 w-full">
                              <span class="text-sm font-bold" style="color: ${lenderColor};">${lender}</span>
                              <span class="text-lg font-black w-20 text-right text-gray-800 dark:text-gray-100">฿${(s.lenderTotals[lender] || 0).toLocaleString()}</span>
                          </div>
                          `;
                      }).join('');
                      
                      if (lenders.length > 1) {
                          breakdownHtml += `
                                  <div class="flex items-center justify-end gap-4 mt-3 pt-3 border-t border-gray-100 dark:border-gray-700 w-full">
                                      <span class="text-sm font-bold text-gray-500">รวมทุกสัญญา</span>
                                      <span class="text-xl font-black w-24 text-right text-blue-500">฿${s.totalNextMonth.toLocaleString()}</span>
                                  </div>
                          `;
                      }
                      
                      breakdownHtml += `</div>`;
                  } else {
                      breakdownHtml = `
                          <div class="flex flex-col items-end">
                              <span class="text-xs font-bold uppercase tracking-widest text-gray-500 mb-1">ยอดเรียกเก็บงวดถัดไป</span>
                              <p class="text-3xl font-black tracking-tight" style="color: #10b981;">฿${s.totalNextMonth.toLocaleString()}</p>
                          </div>
                      `;
                  }

                  let html = `
                  <div class="rounded-2xl overflow-hidden transition-all duration-300 transform hover:-translate-y-1 hover:shadow-xl group" style="border: 1px solid ${dark?'#374151':'#f1f5f9'}; background: ${dark?'#1f2937':'#ffffff'}; box-shadow: ${dark ? '0 10px 25px -5px rgba(0, 0, 0, 0.5)' : '0 10px 15px -3px rgba(0,0,0,0.05)'};">
                    <div class="py-6 px-6 md:px-8 flex flex-col sm:flex-row justify-between items-start sm:items-center cursor-pointer" onclick="window.toggleCustomerExpand('${s.name}')">
                        
                        <div class="flex items-center gap-5 sm:gap-6 mb-4 sm:mb-0 w-full sm:w-auto">
                            <div class="flex flex-col justify-center shrink-0">
                                <p class="font-black text-xl flex items-center gap-3 tracking-wide group-hover:text-blue-500 transition-colors text-gray-900 dark:text-gray-100">
                                    ${s.name}
                                    <span class="text-[10px] text-gray-400 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}">▼</span>
                                </p>
                            </div>
                            <div class="flex flex-row sm:flex-col items-baseline sm:items-start gap-1 sm:gap-0 border-l-2 pl-4 sm:pl-5 border-gray-200 dark:border-gray-700">
                                <span class="text-[10px] font-bold text-gray-400 mb-0.5">จำนวนรายการ</span>
                                <p class="font-black text-base text-blue-500">
                                    ${s.count} <span class="text-sm font-medium text-gray-500">สัญญา</span>
                                </p>
                            </div>
                        </div>

                        <div class="flex flex-col items-end gap-3 w-full sm:w-auto">
                            <div class="text-right w-full flex flex-col items-end">
                                ${breakdownHtml}
                            </div>
                            ${canEditData() ? `<button data-pay-all="${s.name}" onclick="event.stopPropagation();" class="px-6 py-3 rounded-xl text-sm font-bold shadow-sm transition-all ${hasDueItems ? 'hover:-translate-y-0.5 hover:shadow-md' : 'payment-disabled cursor-not-allowed'}" style="background: ${hasDueItems ? (dark ? '#374151' : '#1e293b') : '#e2e8f0'}; color: ${hasDueItems ? 'white' : '#64748b'};" ${hasDueItems ? '' : 'disabled'}>💳 ชำระทั้งหมด</button>` : ''}
                        </div>
                    </div>
                  `;

                  if (isExpanded) {
                      html += `
                      <div class="border-t p-6 md:p-8 overflow-x-auto" style="border-color: ${dark?'#374151':'#f1f5f9'}; background: ${dark?'#111827':'#f8fafc'};">
                          <table class="w-full min-w-[700px]">
                              <thead style="border-bottom: 2px solid ${dark?'#374151':'#e2e8f0'};">
                                  <tr>
                                      <th class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider opacity-60" style="color: ${textColor};">รายการสินค้า</th>
                                      <th class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider opacity-60" style="color: ${textColor};">ราคาสินค้า</th>
                                      <th class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider opacity-60" style="color: ${textColor};">ค่างวด</th>
                                      <th class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider opacity-60" style="color: ${textColor};">งวดทั้งหมด</th>
                                      <th class="px-4 py-3 text-left text-xs font-bold uppercase tracking-wider opacity-60" style="color: ${textColor};">งวดถัดไป</th>
                                      <th class="px-4 py-3 text-center text-xs font-bold uppercase tracking-wider opacity-60" style="color: ${textColor};">${canEditData() ? 'การจัดการ' : 'ผู้ให้บริการ'}</th>
                                  </tr>
                              </thead>
                              <tbody>
                                  ${customerItems.map((c) => {
                                      const canPay = canPayNow(c.next_payment_date, daysBefore);
                                      const hasEditPermission = canEditData();
                                      
                                      let ownerName = '-';
                                      const o = allRecords.find(r => r.type === 'user' && r.id === c.account_id);
                                      if(o) ownerName = o.username;

                                      const lenderColor = getLenderColor(ownerName, dark);
                                      
                                      return `
                                      <tr class="border-b last:border-b-0 hover:bg-white dark:hover:bg-gray-800 transition-colors" style="border-color: ${dark?'#374151':'#e2e8f0'};">
                                          <td class="px-4 py-4 font-bold text-sm flex items-center gap-3" style="color: ${textColor};">
                                              <span class="text-2xl bg-white dark:bg-gray-700 p-2 rounded-xl shadow-sm border border-gray-100 dark:border-gray-600">${getProductIcon(c.product)}</span>
                                              <span class="tracking-wide">${c.product}</span>
                                          </td>
                                          <td class="px-4 py-4 font-medium opacity-80" style="color: ${textColor};">฿${(c.product_price||0).toLocaleString()}</td>
                                          <td class="px-4 py-4 font-black text-base" style="color: ${primaryColor};">฿${(c.monthly_payment||0).toLocaleString()}</td>
                                          <td class="px-4 py-4 font-bold opacity-80" style="color: ${textColor};">${c.paid_installments} / ${c.installments}</td>
                                          <td class="px-4 py-4 font-medium opacity-80" style="color: ${textColor};">${new Date(c.next_payment_date).toLocaleDateString('th-TH')}</td>
                                          <td class="px-4 py-4 text-center">
                                              ${hasEditPermission ? `
                                              <div class="flex justify-center gap-3 items-center">
                                                  <button data-pay="${c.id}" class="flex items-center justify-center w-11 h-11 rounded-xl shadow-sm hover:shadow-md transition-all hover:-translate-y-0.5 ${canPay?'':'payment-disabled'}" style="background: ${canPay?primaryColor:'#9ca3af'}; color: white;" ${canPay?'':'disabled'} title="ชำระเงิน">
                                                      <img src="pay-icon.png" alt="Pay" class="w-6 h-6 object-contain filter drop-shadow-sm" onerror="this.outerHTML='<span class=\\'text-xl\\'>💰</span>'">
                                                  </button>
                                                  <button data-edit="${c.id}" class="flex items-center justify-center w-11 h-11 rounded-xl shadow-sm hover:shadow-md transition-all hover:-translate-y-0.5" style="background: ${dark?'#374151':'#ffffff'}; border: 1px solid ${dark?'#4b5563':'#e2e8f0'}; color: ${textColor};" title="แก้ไข"><span class="text-lg">✏️</span></button>
                                              </div>
                                              ` : `<span class="text-sm font-bold tracking-wide border px-3 py-1 rounded-md" style="color: ${lenderColor}; border-color: ${lenderColor}40; background: ${lenderColor}10;">${ownerName}</span>`}
                                          </td>
                                      </tr>
                                      `;
                                  }).join('')}
                              </tbody>
                          </table>
                      </div>
                      `;
                  }
                  
                  html += `</div>`;
                  return html;
                }).join('')}
                </div>
            </div>
        </div>
      </div>`;
    }

    function getPaymentData() {
        const history = getHistoryRecords(); 
        const allCustomers = allRecords.filter(r => r.type === 'customer');
        const payments = [];
        const regex = /^(.+?) ชำระเงินค่า (.+?) งวดที่ \d+ ราคา ([\d,]+(\.\d{1,2})?) บาท/;

        history.forEach(h => {
            if (h.history_action === 'ชำระเงิน' || h.history_action === 'ชำระเงินครบ') {
                const match = h.history_details.match(regex);
                
                if (match) {
                    const name = match[1].trim();
                    const product = match[2].trim();
                    const amountStr = match[3].replace(/,/g, '');
                    const amount = parseFloat(amountStr);
                    
                    let cost = 0;
                    let profit = amount;
                    
                    const cust = allCustomers.find(c => c.customer_name === name && c.product === product);
                    
                    if (cust && cust.product_price && cust.installments && parseInt(cust.installments) > 0) {
                        cost = Math.round(parseFloat(cust.product_price) / parseInt(cust.installments));
                        profit = amount - cost;
                    }
                    
                    if (isNaN(cost) || cost < 0) cost = 0;
                    if (isNaN(profit)) profit = amount;

                    payments.push({
                        date: new Date(h.history_date),
                        name: name,
                        product: product,
                        amount: amount,
                        cost: cost,
                        profit: profit
                    });
                } else {
                    const nameMatch = h.history_details.match(/^(.+?) ชำระเงินค่า/);
                    const amountMatch = h.history_details.match(/ราคา ([\d,]+(\.\d{1,2})?) บาท/);
                    if (nameMatch && amountMatch) {
                         const amount = parseFloat(amountMatch[1].replace(/,/g, ''));
                         payments.push({
                            date: new Date(h.history_date),
                            name: nameMatch[1].trim(),
                            product: 'ไม่ระบุ',
                            amount: isNaN(amount) ? 0 : amount,
                            cost: 0,
                            profit: isNaN(amount) ? 0 : amount
                        });
                    }
                }
            }
        });
        return payments;
    }

    function getAggregatedStatementData() {
        const payments = getPaymentData();
        const year = stmtSelectedDate.getFullYear();
        let filtered = payments.filter(p => p.date.getFullYear() === year);

        let summaryByCustomer = {};
        let totalAmount = 0;
        let totalProfit = 0;
        let totalCost = 0;

        filtered.forEach(p => {
            totalAmount += (p.amount || 0);
            totalProfit += (p.profit || 0);
            totalCost += (p.cost || 0);

            if (!summaryByCustomer[p.name]) {
                summaryByCustomer[p.name] = { amount: 0, profit: 0, cost: 0 };
            }
            summaryByCustomer[p.name].amount += (p.amount || 0);
            summaryByCustomer[p.name].profit += (p.profit || 0);
            summaryByCustomer[p.name].cost += (p.cost || 0);
        });

        let donutData = [totalCost, totalProfit];

        let top5 = Object.keys(summaryByCustomer)
            .map(name => ({ name, amount: summaryByCustomer[name].amount, profit: summaryByCustomer[name].profit }))
            .sort((a, b) => b.amount - a.amount)
            .slice(0, 5);

        return { 
            totalAmount, 
            totalProfit, 
            totalCost, 
            summaryByCustomer, 
            donutData,
            top5,
            recentPayments: filtered.sort((a,b) => b.date - a.date).slice(0, 20)
        };
    }
